# Publishes the site to GitHub Pages on every push to main.
# The content editor (admin.html) stays in the repo for local use but is left out of the live site.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build public folder (without the editor)
        run: |
          mkdir _site
          cp -r index.html world.html project.html cv.html assets _site/
          rm -f _site/assets/js/admin.js _site/assets/css/admin.css
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
